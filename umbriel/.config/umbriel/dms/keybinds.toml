[keybinds]

# Noctalia Specific Binds
"Mod" = "spawn:dms ipc call control-center toggle"
"Mod+Space" = "spawn:dms ipc call spotlight toggle"
"Mod+V" = "spawn:dms ipc call clipboardPlus togglePanel"
"Mod+Y" = "spawn:dms ipc call dash toggle wallpaper"
"Mod+N" = "spawn:dms ipc call notifications toggle"
"Mod+Shift+N" = "spawn:dms ipc call notepad toggle"
"Mod+R" = "spawn:dms ipc call quickCapture screenshot region edit"
"Mod+Shift+R" = "spawn:dms screenshot full"
"Mod+X" = "spawn:dms ipc call powermenu toggle"
"Mod+Comma" = "spawn:dms ipc call settings toggle"
"Alt+Tab" = "spawn:noctalia msg window-switcher"

# Binds intended to work while locked use the table form.
"XF86MonBrightnessDown" = { action = "spawn:dms ipc call brightness decrement 5", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:dms ipc call brightness increment 5", allow_when_locked = true }
"Mod+Shift+M" = "spawn:dms ipc call audio cycleoutput"
